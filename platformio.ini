; Each example = one environment. Pick it from the VS Code status bar
; ("Switch PlatformIO Project Environment") or from the terminal:
;   pio run -e breathing_fade -t upload
; All examples use D1 (LED 1) and D2 (LED 2), each through a 220 ohm resistor.

[platformio]
default_envs = web_slider

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    marcoschwartz/LiquidCrystal_I2C

[env:alternate_blink]
build_src_filter = -<*> +<01_alternate_blink/>

[env:sync_blink]
build_src_filter = -<*> +<02_sync_blink/>

[env:breathing_fade]
build_src_filter = -<*> +<03_breathing_fade/>

[env:swing_fade]
build_src_filter = -<*> +<04_swing_fade/>

[env:sos]
build_src_filter = -<*> +<05_sos/>

[env:candle]
build_src_filter = -<*> +<06_candle/>

[env:serial_control]
build_src_filter = -<*> +<07_serial_control/>

[env:ldr_auto]
build_src_filter = -<*> +<08_ldr_auto/>

[env:web_slider]
build_src_filter = -<*> +<09_web_slider/>

[env:web_effects]
build_src_filter = -<*> +<10_web_effects/>
